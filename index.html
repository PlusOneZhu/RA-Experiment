<!DOCTYPE html>
<html>
<head>
    <title>我的 jsPsych 实验</title>

    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-instructions@1.1.4"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
    <link href="./style.css" rel="stylesheet" type="text/css" />
    <script src="./assets/hsi-stocks.js"></script>
    <script src="./assets/hsi-stock-english-names.js"></script>
    <script src="./assets/robo-allocation.js"></script>
</head>
<body>
    <div class="layout">
        <div class="image-panel">
            <img src="./assets/Robo-image.png" alt="Experiment Illustration">
        </div>
        <div class="experiment-panel">
            <div id="jspsych-target"></div>
        </div>
    </div>

    <script>
        // 1. 获取 Qualtrics 传过来的 ResponseID
        const urlParams = new URLSearchParams(window.location.search);
        const surveyAResponseID = urlParams.get('SurveyA_ResponseID') || urlParams.get('Q_R') || 'TEST_USER';
        const qualtricsBaseUrl = 'https://ust.az1.qualtrics.com/jfe/form/SV_eEgPdUZHHxl9UeW';

        const roboAdvisorGroups = ['High DT', 'Low DT'];
        const roboAdvisorGroup = roboAdvisorGroups[Math.floor(Math.random() * roboAdvisorGroups.length)];
        let selectedAttentionAnswer = '';
        const roboSuggestionImage = {
            'High DT': './assets/Robo suggestion - High DT.png',
            'Low DT': './assets/Robo suggestion - Low DT.png'
        }[roboAdvisorGroup];

        // 2. 初始化实验变量
        let experimentData = {
            RA_Usage: 0,           // One-Click 使用状态：0 = 未使用，1 = 已使用
            Manual_Trade: [],      // 仅记录用户手动确认的买卖
            Final_Portfolio: {},    // 保存最终持仓数量和现金余额
            ATT_Sharpe: '',
            Robo_Advisor_Group: roboAdvisorGroup
        };

        let cashBalance = 10000000;
        const holdings = new Map();

        // 3. 初始化 jsPsych
        const jsPsych = initJsPsych({
            display_element: 'jspsych-target',
            on_finish: function() {
                const redirectUrl = new URL(qualtricsBaseUrl);
                redirectUrl.searchParams.set('SurveyA_ResponseID', surveyAResponseID);
                redirectUrl.searchParams.set('RA_Usage', experimentData.RA_Usage);
                redirectUrl.searchParams.set('Manual_Trade', JSON.stringify(experimentData.Manual_Trade));
                redirectUrl.searchParams.set('Final_Portfolio', JSON.stringify(experimentData.Final_Portfolio));
                redirectUrl.searchParams.set('ATT_Sharpe', experimentData.ATT_Sharpe);
                redirectUrl.searchParams.set('Robo_Advisor_Group', experimentData.Robo_Advisor_Group);

                window.location.href = redirectUrl.toString();
            }
        });

        let timeline = [];

        let countdownInterval = null;
        let portfolioPageObserver = null;

        function setPageLayout(mode) {
            const imagePanel = document.querySelector('.image-panel');
            const experimentPanel = document.querySelector('.experiment-panel');

            if (!imagePanel || !experimentPanel) return;

            if (mode === 'image') {
                imagePanel.classList.remove('hidden');
                experimentPanel.classList.remove('full-width');
            } else {
                imagePanel.classList.add('hidden');
                experimentPanel.classList.add('full-width');
            }
        }

        function enableNextAfterDelay(seconds) {
            const nav = document.querySelector('.jspsych-instructions-nav');
            const buttons = nav ? nav.querySelectorAll('button') : [];
            const nextBtn = buttons.length ? buttons[buttons.length - 1] : null;

            if (!nav || !nextBtn) return;

            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }

            let timerEl = document.getElementById('next-timer');
            if (!timerEl) {
                timerEl = document.createElement('span');
                timerEl.id = 'next-timer';
                timerEl.className = 'next-timer';
                nav.appendChild(timerEl);
            }

            let remaining = seconds;

            nextBtn.disabled = true;
            nextBtn.style.opacity = '0.5';
            nextBtn.style.cursor = 'not-allowed';

            timerEl.textContent = remaining + 's';
            timerEl.classList.add('visible');

            countdownInterval = setInterval(() => {
                remaining -= 1;
                timerEl.textContent = remaining + 's';

                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;

                    nextBtn.disabled = false;
                    nextBtn.style.opacity = '1';
                    nextBtn.style.cursor = 'pointer';
                    timerEl.classList.remove('visible');
                    timerEl.textContent = '';
                }
            }, 1000);
        }

        const introInstructions = {
            type: jsPsychInstructions,
            pages: [
                '<div id="intro-page" class="instruction-text">' +
                    '<h2>Robo-Advisor Assisted Investment Game</h2>' +
                    '<p>Welcome to this investment game!</p>' +
                    '<ul class="instruction-list">' +
                        '<li>You will be given <strong>a virtual HK$10 million</strong> for investment in 95 stocks that comprise the Hang Seng Index in Hong Kong.</li>' +
                        '<li>A robo-advisor designed by professors at HKUST will assist you in this game.</li>' +
                        '<li>Each participant will receive <strong>HK$50</strong> upon successful completion of the game today.</li>' +
                        '<li>The performance of your chosen portfolio will be evaluated in one-month time, i.e., on 15 December, 2026. The top 10 winners will earn an <strong>extra cash reward of $100 each</strong>.</li>' +
                    '</ul>' +
                    '<p>Please click "Next" to begin.</p>' +
                '</div>'
            ],
            show_clickable_nav: true,
            on_start: function() {
                setPageLayout('image');
            },
            on_load: function() {
                enableNextAfterDelay(2);
            }
        };

        const attentionOptions = [
            "A financial knowledge competition",
            "An investment competition",
            "A sports competition",
            "A business competition"
        ];
        for (let index = attentionOptions.length - 1; index > 0; index--) {
            const randomIndex = Math.floor(Math.random() * (index + 1));
            [attentionOptions[index], attentionOptions[randomIndex]] = [attentionOptions[randomIndex], attentionOptions[index]];
        }
        let attentionPageObserver = null;

        const roboInstructions = {
            type: jsPsychInstructions,
            pages: [
                `
                <div id="robo-page" class="instruction-text">
                    <h2>What is Robo-Advisor and how does it work?</h2>

                    <ol class="instruction-list">
                        <li>Robo-advisors are digital tools that can provide automated, algorithm-driven financial planning services. A typical robo-advisor collects information from clients about their financial situation and risk preferences through an online survey, and then uses the data to offer investment advice. Some robo-advisors can automatically invest assets if requested by clients.</li>

                        <li>The design of the robo-advisor used in this game was based on the modern portfolio theory originally proposed by <strong>Nobel Prize Winner Markowitz</strong> in 1952, and further improved by Professor Yingying Li and Professor Xinhua Zheng from <strong>the Hong Kong University of Science and Technology</strong>.</li>

                        <li>
                            Our robo-advisor’s algorithm will first estimate the <strong>optimum annual volatility</strong>, and then generate an investment portfolio by <strong>maximizing the Sharpe Ratio</strong> based on the optimum annual volatility.
                            <ul class="instruction-sublist">
                                <li><strong>Volatility</strong> measures how much an asset price changes over time. High volatility means the price of an asset is likely to change dramatically in a short period of time while low volatility indicates an asset’s price will be relatively stable. Standard deviation is a typical measure of volatility.</li>
                                <li><strong>Sharpe ratio</strong> is the measure of <strong>risk-adjusted return</strong> of a financial portfolio. A portfolio with a higher Sharpe ratio is considered superior relative to its peers.</li>
                            </ul>
                        </li>

                        <li>In this game, we use Sharpe ratio to evaluate and rank players’ investment performance.</li>
                        <li>When market condition changes, the robo-advisor will automatically rebalance, i.e., recalculate the portfolio to keep it on track.</li>
                    </ol>
                </div>
                `,
                `
                <div class="instruction-text attention-check">
                    <fieldset>
                        <legend>What type of competition are you going to participate in?</legend>
                        ${attentionOptions.map(option => `
                            <label class="attention-check-option">
                                <input type="radio" name="ATT_Sharpe" value="${option}" ${selectedAttentionAnswer === option ? 'checked' : ''}>
                                <span>${option}</span>
                            </label>
                        `).join('')}
                    </fieldset>
                    <p class="attention-check-note">This is an attention check. If you are unsure, you may go back to review the information. Incorrect answers will not receive a reward.</p>
                </div>
                `
            ],
            show_clickable_nav: true,
            allow_backward: true,
            on_start: function() {
                setPageLayout('image');
            },
            on_load: function() {
                enableNextAfterDelay(2);
                attentionPageObserver = new MutationObserver(setupAttentionQuestion);
                attentionPageObserver.observe(document.getElementById('jspsych-target'), {
                    childList: true,
                    subtree: true
                });
                setupAttentionQuestion();
            },
            on_finish: function() {
                if (attentionPageObserver) {
                    attentionPageObserver.disconnect();
                    attentionPageObserver = null;
                }
                experimentData.ATT_Sharpe = selectedAttentionAnswer;
            }
        };

        function setupAttentionQuestion() {
            const options = document.querySelectorAll('input[name="ATT_Sharpe"]');
            if (options.length === 0) return;

            const nav = document.querySelector('.jspsych-instructions-nav');
            const buttons = nav ? nav.querySelectorAll('button') : [];
            const nextButton = buttons.length ? buttons[buttons.length - 1] : null;
            if (!nextButton) return;

            nextButton.disabled = !selectedAttentionAnswer;
            options.forEach(option => {
                option.checked = option.value === selectedAttentionAnswer;
                option.addEventListener('change', () => {
                    selectedAttentionAnswer = option.value;
                    nextButton.disabled = false;
                });
            });
        }

        const rulesInstructions = {
            type: jsPsychInstructions,
            pages: [
                `
                <div id="rules-page" class="instruction-text">
                    <h2>Game Rules</h2>

                    <h3>1. General Notice</h3>
                    <ul class="instruction-list">
                        <li><strong>Virtual Currency:</strong> Each participant is allocated <strong>HKD $10,000,000</strong> in virtual funds. This virtual balance has no real-world monetary value and cannot be withdrawn, exchanged, or converted into real cash.</li>
                        <li><strong>Evaluation:</strong> All participants will be ranked based on the <strong>Sharpe Ratio</strong> of their portfolio calculated on the final trading day of the <strong>1-month period</strong>.</li>
                    </ul>

                    <h3>2. Portfolio Decision</h3>
                    <ul class="instruction-list">
                        <li><strong>One-Time Allocation:</strong> You must select and submit your investment portfolio during the initial experiment session. Once submitted, no modifications or trading changes are permitted for the remaining days.</li>
                        <li><strong>Stocks:</strong> The stock pool is strictly limited to the constituents of the <strong>Hang Seng Index (HSI)</strong> as of <strong>September 2026</strong>.</li>
                        <li><strong>Allocation Flexibility:</strong> There are no restrictions on how you divide or allocate your virtual capital among the eligible constituents.</li>
                    </ul>

                    <h3>3. Transaction Fees</h3>
                    <p>All buy and sell orders will incur standard transaction fees deducted directly from your virtual balance. Each transaction fee consists of four components:</p>
                    <ol class="instruction-list">
                        <li>Brokerage Commission: 0.0668% of the transaction value (Minimum: HKD $50 per trade).</li>
                        <li>Levies (HKEX & SFC): 0.0077% of the transaction value.</li>
                        <li>Stamp Duty: 0.13% of the transaction value.</li>
                        <li>Trading Fee: 0.006% of the transaction value (Maximum: HKD $200 per trade).</li>
                    </ol>

                    <h3>4. Fair Play</h3>
                    <ul class="instruction-list">
                        <li><strong>Prohibition:</strong> Participants must not exploit any software bugs, errors, or system loopholes.</li>
                        <li><strong>Penalties:</strong> If a participant is found abusing system flaws (whether publicly known or undisclosed), the organizing committee reserves the right to adjust the participant's Sharpe Ratio or disqualify them entirely without prior notice.</li>
                    </ul>
                </div>
                `
            ],
            show_clickable_nav: true,
            on_start: function() {
                setPageLayout('no-image');
            },
            on_load: function() {
                enableNextAfterDelay(2);
            }
        };

        const portfolioInstructions = {
            type: jsPsychInstructions,
            pages: [
                `
                <div id="portfolio-page" class="instruction-text portfolio-summary">
                    <h2>My Portfolio</h2>
                    <p>Total Value of Your Investment Portfolio:<br><strong>HK$10,000,000.00</strong></p>
                    <p>Total Cash In Your Investment Portfolio:<br><strong>HK$10,000,000.00</strong></p>
                    <img class="portfolio-empty-image" src="./assets/Portfolio_none.png" alt="No investment portfolio has been created">
                    <p><em>You haven't created an investment portfolio!</em></p>
                </div>
                `
            ],
            show_clickable_nav: true,
            on_start: function() {
                setPageLayout('no-image');
            },
            on_load: function() {
                enableNextAfterDelay(3);
            }
        };

        const createPortfolioInstructions = {
            type: jsPsychInstructions,
            pages: [
                `
                <div id="robo-suggestion-page" class="instruction-text portfolio-summary">
                    <h2>Robo-advisor Suggested Investment Portfolio</h2>
                    ${roboSuggestionImage
                        ? `<img class="robo-suggestion-image" src="${roboSuggestionImage}" alt="Robo-advisor suggested investment portfolio">`
                        : ''}
                </div>
                `,
                `
                <div id="create-portfolio-page" class="instruction-text">
                    <h2>Create My Investment Portfolio</h2>
                    <p id="trade-success-message" class="trade-success-message" role="status" aria-live="polite" hidden></p>
                    <div class="create-instructions">
                        <section class="robo-follow-panel">
                            <button id="robo-follow-button" class="one-click-button" type="button">
                                One-Click<br>to Follow the Robo-Advisor’s<br>Recommendation
                            </button>
                        </section>
                        <section class="how-to-use">
                            <h3>How to Use</h3>
                            <ol>
                                <li>Select any of the following securities, or search using the input field below.</li>
                                <li>Select a security to open the trading window.</li>
                                <li>Select “Buy” or “Sell”, enter the number of units, then click “Confirmation”.</li>
                                <li>You may also click the button on the right to sell all your current holdings and switch to Robo-advisor's recommended portfolio!</li>
                            </ol>
                        </section>
                    </div>

                    <section class="portfolio-account" aria-live="polite">
                        <div><span>Total Value of Your Investment Portfolio</span><strong id="portfolio-total-value">HK$10,000,000.00</strong></div>
                        <div><span>Total Cash In Your Investment Portfolio</span><strong id="portfolio-cash-balance">HK$10,000,000.00</strong></div>
                    </section>

                    <section class="stock-market">
                        <h3>Hang Seng Index Securities</h3>
                        <p class="stock-coverage-note">
                            Stock names and HKD prices are based on the supplied Hang Seng Index list: <strong id="quote-updated-at"></strong>. These are fixed simulation prices, not live quotes.
                        </p>
                        <label class="stock-search-label" for="stock-search">Search securities</label>
                        <input id="stock-search" class="stock-search" type="search" placeholder="Search by company name or code">
                        <div id="stock-grid" class="stock-grid" aria-live="polite"></div>
                    </section>

                    <div id="trade-modal" class="confirmation-modal" hidden>
                        <section id="trade-ticket" class="trade-ticket confirmation-modal__content trade-modal__content"
                                 role="dialog" aria-modal="true" aria-labelledby="trade-modal-title">
                            <header class="trade-modal__header">
                                <h3 id="trade-modal-title">Trade <span id="selected-stock-name"></span></h3>
                                <button id="close-trade-modal" class="trade-modal__close" type="button" aria-label="Close trading window">&times;</button>
                            </header>
                            <p id="selected-stock-price"></p>
                            <div class="trade-controls">
                                <div class="trade-action-buttons" role="group" aria-label="Trade direction">
                                    <button id="buy-stock" class="trade-action-button" type="button" aria-pressed="false">Buy</button>
                                    <button id="sell-stock" class="trade-action-button" type="button" aria-pressed="false">Sell</button>
                                </div>
                                <label for="trade-quantity">Number of units</label>
                                <input id="trade-quantity" type="number" min="1" step="1" value="1">
                            </div>
                            <p id="trade-estimate" class="trade-estimate"></p>
                            <p id="trade-message" class="trade-message" role="status" aria-live="polite"></p>
                            <button id="confirm-trade" class="confirm-trade-button" type="button">Confirmation</button>
                        </section>
                    </div>

                    <section class="current-portfolio-section">
                        <h3>Current Portfolio</h3>
                        <div class="portfolio-table-wrapper">
                            <table class="portfolio-table">
                                <thead>
                                    <tr>
                                        <th scope="col">Stock</th>
                                        <th scope="col">Shares held</th>
                                        <th scope="col">Price per share</th>
                                        <th scope="col">Total value</th>
                                    </tr>
                                </thead>
                                <tbody id="current-portfolio-holdings">
                                    <tr><td class="portfolio-empty" colspan="4">No stocks currently held.</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </section>

                    <div id="robo-confirm-modal" class="confirmation-modal" hidden>
                        <div class="confirmation-modal__content" role="alertdialog" aria-modal="true"
                             aria-labelledby="robo-confirm-title" aria-describedby="robo-confirm-message">
                            <h3 id="robo-confirm-title">Confirm portfolio replacement</h3>
                            <p id="robo-confirm-message">Are you sure that you want to replace your current portfolio with what’s recommended by the robo-advisor? Transaction fees will apply!</p>
                            <div class="confirmation-modal__actions">
                                <button id="robo-confirm-cancel" class="confirmation-modal__button confirmation-modal__button--cancel" type="button">Cancel</button>
                                <button id="robo-confirm-yes" class="confirmation-modal__button confirmation-modal__button--confirm" type="button">Yes</button>
                            </div>
                        </div>
                    </div>
                </div>
                `
            ],
            show_clickable_nav: true,
            allow_backward: true,
            button_label_previous: 'Back',
            on_start: function() {
                setPageLayout('no-image');
            },
            on_load: function() {
                const target = document.getElementById('jspsych-target');
                let initializedGrid = null;
                portfolioPageObserver = new MutationObserver(() => {
                    const page = target.querySelector('#create-portfolio-page');
                    const panel = document.querySelector('.experiment-panel');
                    if (!page) {
                        panel.classList.remove('trade-page');
                        initializedGrid = null;
                        return;
                    }

                    const grid = page.querySelector('#stock-grid');
                    if (!grid || grid === initializedGrid) return;
                    initializedGrid = grid;
                    panel.classList.add('trade-page');
                    initializePortfolioPage();
                });
                portfolioPageObserver.observe(target, { childList: true, subtree: true });

                function initializePortfolioPage() {
                const grid = document.getElementById('stock-grid');
                const searchInput = document.getElementById('stock-search');
                const tradeModal = document.getElementById('trade-modal');
                const closeTradeModalButton = document.getElementById('close-trade-modal');
                const selectedStockName = document.getElementById('selected-stock-name');
                const selectedStockPrice = document.getElementById('selected-stock-price');
                const quantityInput = document.getElementById('trade-quantity');
                const estimate = document.getElementById('trade-estimate');
                const message = document.getElementById('trade-message');
                const cashDisplay = document.getElementById('portfolio-cash-balance');
                const totalDisplay = document.getElementById('portfolio-total-value');
                const portfolioHoldings = document.getElementById('current-portfolio-holdings');
                const successMessage = document.getElementById('trade-success-message');
                const followButton = document.getElementById('robo-follow-button');
                const confirmModal = document.getElementById('robo-confirm-modal');
                const cancelFollowButton = document.getElementById('robo-confirm-cancel');
                const confirmFollowButton = document.getElementById('robo-confirm-yes');
                let selectedStock = null;
                let selectedStockCard = null;
                let tradeAction = null;
                let roboTargetHoldings = null;

                const formatMoney = amount => `HK$${amount.toLocaleString('en-HK', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                })}`;
                const roundMoney = amount => Math.round((amount + Number.EPSILON) * 100) / 100;
                const calculateFees = amount => {
                    const brokerage = Math.max(50, amount * 0.000668);
                    const levies = amount * 0.000077;
                    const stampDuty = amount * 0.0013;
                    const tradingFee = Math.min(amount * 0.00006, 200);
                    return roundMoney(brokerage + levies + stampDuty + tradingFee);
                };

                function clearSuccessMessage() {
                    successMessage.textContent = '';
                    successMessage.hidden = true;
                }

                function updateAccountSummary() {
                    const holdingsValue = [...holdings.entries()].reduce((total, [code, quantity]) => {
                        const stock = window.hsiStocks.find(item => item.code === code);
                        return total + (stock ? stock.price * quantity : 0);
                    }, 0);
                    cashDisplay.textContent = formatMoney(cashBalance);
                    totalDisplay.textContent = formatMoney(cashBalance + holdingsValue);
                    experimentData.Final_Portfolio = Object.fromEntries(holdings);
                    experimentData.Final_Portfolio.CASH = roundMoney(cashBalance);
                    portfolioHoldings.replaceChildren();
                    const currentHoldings = [...holdings.entries()].filter(([, quantity]) => quantity > 0);
                    if (currentHoldings.length === 0) {
                        const emptyRow = document.createElement('tr');
                        const emptyCell = document.createElement('td');
                        emptyCell.className = 'portfolio-empty';
                        emptyCell.colSpan = 4;
                        emptyCell.textContent = 'No stocks currently held.';
                        emptyRow.appendChild(emptyCell);
                        portfolioHoldings.appendChild(emptyRow);
                        return;
                    }

                    currentHoldings.forEach(([code, quantity]) => {
                        const stock = stockByCode.get(code);
                        if (!stock) return;

                        const row = document.createElement('tr');
                        const values = [
                            `${stock.name} (${stock.ticker})`,
                            quantity.toLocaleString('en-HK'),
                            formatMoney(stock.price),
                            formatMoney(stock.price * quantity)
                        ];
                        values.forEach(value => {
                            const cell = document.createElement('td');
                            cell.textContent = value;
                            row.appendChild(cell);
                        });
                        portfolioHoldings.appendChild(row);
                    });
                }

                document.getElementById('quote-updated-at').textContent = window.hsiQuotesAt;

                function updateEstimate() {
                    if (!selectedStock || !tradeAction) {
                        estimate.textContent = 'Select Buy or Sell and enter a quantity to preview the order.';
                        return;
                    }

                    const quantity = Number(quantityInput.value);
                    if (!Number.isInteger(quantity) || quantity < 1) {
                        estimate.textContent = 'Enter a whole number of units greater than zero.';
                        return;
                    }

                    const amount = selectedStock.price * quantity;
                    const fees = calculateFees(amount);
                    const holding = holdings.get(selectedStock.code) || 0;
                    estimate.textContent = tradeAction === 'BUY'
                        ? `Order value: ${formatMoney(amount)} · Estimated fees: ${formatMoney(fees)} · Total: ${formatMoney(amount + fees)}`
                        : `Order value: ${formatMoney(amount)} · Estimated fees: ${formatMoney(fees)} · Shares held: ${holding}`;
                }

                function selectAction(action) {
                    tradeAction = action;
                    document.getElementById('buy-stock').setAttribute('aria-pressed', String(action === 'BUY'));
                    document.getElementById('sell-stock').setAttribute('aria-pressed', String(action === 'SELL'));
                    message.textContent = '';
                    clearSuccessMessage();
                    updateEstimate();
                }

                const stockByCode = new Map(window.hsiStocks.map(stock => [stock.code, stock]));
                const recommendationTotalWeight = window.roboPortfolioAllocation.reduce(
                    (total, item) => total + item.weight,
                    0
                );
                const recommendedStocks = window.roboPortfolioAllocation
                    .map(item => ({
                        stock: stockByCode.get(item.code),
                        weight: item.weight
                    }))
                    .filter(item => item.stock && item.stock.price > 0);
                const fixedRecommendationQuantities = new Map([
                    ['00241', 4922],
                    ['00669', 2389]
                ]);

                function closeTradeModal() {
                    tradeModal.hidden = true;
                    if (selectedStockCard && selectedStockCard.isConnected) {
                        selectedStockCard.focus();
                    } else {
                        searchInput.focus();
                    }
                }

                closeTradeModalButton.addEventListener('click', closeTradeModal);
                tradeModal.addEventListener('click', event => {
                    if (event.target === tradeModal) {
                        closeTradeModal();
                    }
                });
                tradeModal.addEventListener('keydown', event => {
                    if (event.key === 'Escape' && !tradeModal.hidden) {
                        closeTradeModal();
                    }
                });

                window.hsiStocks.forEach(stock => {
                    const card = document.createElement('button');
                    card.type = 'button';
                    card.className = 'stock-card';
                    card.disabled = !(stock.price > 0);

                    const names = document.createElement('span');
                    names.className = 'stock-names';
                    const englishName = document.createElement('strong');
                    englishName.className = 'stock-name-en';
                    englishName.textContent = window.hsiStockEnglishNames[stock.code] || stock.name;
                    const chineseName = document.createElement('span');
                    chineseName.className = 'stock-name-zh';
                    chineseName.textContent = stock.name;
                    names.append(englishName, chineseName);

                    const ticker = document.createElement('span');
                    ticker.className = 'stock-ticker';
                    ticker.textContent = stock.ticker;

                    card.append(names, ticker);
                    card.dataset.search = `${stock.code} ${stock.ticker} ${stock.name} ${englishName.textContent}`.toLocaleLowerCase();
                    card.addEventListener('click', () => {
                        selectedStockCard = card;
                        selectedStock = stock;
                        tradeAction = null;
                        clearSuccessMessage();
                        selectedStockName.textContent = `${stock.name} · ${stock.ticker}`;
                        selectedStockPrice.textContent = `Price: ${formatMoney(stock.price)} per unit`;
                        quantityInput.value = '1';
                        document.getElementById('buy-stock').setAttribute('aria-pressed', 'false');
                        document.getElementById('sell-stock').setAttribute('aria-pressed', 'false');
                        message.textContent = '';
                        tradeModal.hidden = false;
                        updateEstimate();
                        closeTradeModalButton.focus();
                    });
                    grid.appendChild(card);
                });

                searchInput.addEventListener('input', () => {
                    const query = searchInput.value.trim().toLocaleLowerCase();
                    grid.querySelectorAll('.stock-card').forEach(card => {
                        card.hidden = !card.dataset.search.includes(query);
                    });
                });

                document.getElementById('buy-stock').addEventListener('click', () => selectAction('BUY'));
                document.getElementById('sell-stock').addEventListener('click', () => selectAction('SELL'));
                quantityInput.addEventListener('input', updateEstimate);

                document.getElementById('confirm-trade').addEventListener('click', () => {
                    const quantity = Number(quantityInput.value);
                    if (!selectedStock || !tradeAction) {
                        message.textContent = 'Select a stock and choose Buy or Sell first.';
                        return;
                    }
                    if (!Number.isInteger(quantity) || quantity < 1) {
                        message.textContent = 'Enter a whole number of units greater than zero.';
                        return;
                    }

                    const orderValue = roundMoney(selectedStock.price * quantity);
                    const fees = calculateFees(orderValue);
                    const heldQuantity = holdings.get(selectedStock.code) || 0;

                    if (tradeAction === 'BUY') {
                        const totalCost = roundMoney(orderValue + fees);
                        if (totalCost > cashBalance) {
                            message.textContent = 'Insufficient cash to complete this purchase, including fees.';
                            return;
                        }
                        cashBalance = roundMoney(cashBalance - totalCost);
                        holdings.set(selectedStock.code, heldQuantity + quantity);
                    } else {
                        if (quantity > heldQuantity) {
                            message.textContent = `Insufficient shares to sell. You currently hold ${heldQuantity} units.`;
                            return;
                        }
                        cashBalance = roundMoney(cashBalance + orderValue - fees);
                        const remaining = heldQuantity - quantity;
                        if (remaining === 0) {
                            holdings.delete(selectedStock.code);
                        } else {
                            holdings.set(selectedStock.code, remaining);
                        }
                    }

                    const tradeRecord = {
                        action: tradeAction,
                        name: selectedStock.name,
                        ticker: selectedStock.ticker,
                        quantity,
                        price: selectedStock.price,
                        fees,
                        orderValue,
                        cashAfter: cashBalance
                    };
                    experimentData.Manual_Trade.push(tradeRecord);

                    message.textContent = '';
                    successMessage.textContent = tradeAction === 'BUY'
                        ? 'Purchase successful.'
                        : 'Sale successful.';
                    successMessage.hidden = false;
                    closeTradeModal();
                    updateAccountSummary();
                    updateEstimate();
                    successMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
                });

                followButton.addEventListener('click', () => {
                    if (followButton.disabled || recommendedStocks.length === 0 || recommendationTotalWeight <= 0) {
                        return;
                    }

                    clearSuccessMessage();
                    confirmModal.hidden = false;
                    cancelFollowButton.focus();
                });

                function closeConfirmationModal() {
                    confirmModal.hidden = true;
                    followButton.focus();
                }

                cancelFollowButton.addEventListener('click', closeConfirmationModal);
                confirmModal.addEventListener('click', event => {
                    if (event.target === confirmModal) {
                        closeConfirmationModal();
                    }
                });
                confirmModal.addEventListener('keydown', event => {
                    if (event.key === 'Escape' && !confirmModal.hidden) {
                        closeConfirmationModal();
                    }
                });

                confirmFollowButton.addEventListener('click', () => {
                    closeConfirmationModal();
                    experimentData.RA_Usage = 1;

                    if (roboTargetHoldings === null) {
                        const currentHoldingsValue = [...holdings.entries()].reduce((total, [code, quantity]) => {
                            const stock = stockByCode.get(code);
                            return total + (stock ? stock.price * quantity : 0);
                        }, 0);
                        const potentialSaleFees = [...holdings.entries()].reduce((total, [code, quantity]) => {
                            const stock = stockByCode.get(code);
                            return total + (stock ? calculateFees(stock.price * quantity) : 0);
                        }, 0);
                        const targetPortfolioValue = Math.max(
                            0,
                            cashBalance + currentHoldingsValue - potentialSaleFees
                        );

                        roboTargetHoldings = new Map(recommendedStocks.map(item => {
                            const fixedQuantity = fixedRecommendationQuantities.get(item.stock.code);
                            if (fixedQuantity !== undefined) {
                                return [item.stock.code, fixedQuantity];
                            }

                            const allocationWeight = item.weight / recommendationTotalWeight;
                            const allocationBudget = targetPortfolioValue * allocationWeight;
                            const estimatedFees = calculateFees(allocationBudget);
                            const quantity = Math.floor(
                                Math.max(0, allocationBudget - estimatedFees) / item.stock.price
                            );
                            return [item.stock.code, quantity];
                        }));
                    }

                    const sellOrders = [];
                    const buyOrders = [];

                    for (const [code, quantity] of holdings.entries()) {
                        const stock = stockByCode.get(code);
                        if (!stock || quantity <= 0) continue;

                        const targetQuantity = roboTargetHoldings.get(code) || 0;
                        if (quantity > targetQuantity) {
                            sellOrders.push({ stock, quantity: quantity - targetQuantity });
                        }
                    }

                    for (const item of recommendedStocks) {
                        const currentQuantity = holdings.get(item.stock.code) || 0;
                        const targetQuantity = roboTargetHoldings.get(item.stock.code) || 0;
                        if (targetQuantity > currentQuantity) {
                            buyOrders.push({
                                stock: item.stock,
                                quantity: targetQuantity - currentQuantity
                            });
                        }
                    }

                    const saleProceeds = sellOrders.reduce((total, order) => {
                        const orderValue = roundMoney(order.stock.price * order.quantity);
                        return total + orderValue - calculateFees(orderValue);
                    }, 0);
                    const purchaseCost = buyOrders.reduce((total, order) => {
                        const orderValue = roundMoney(order.stock.price * order.quantity);
                        return total + orderValue + calculateFees(orderValue);
                    }, 0);

                    if (purchaseCost > cashBalance + saleProceeds + 0.01) {
                        message.textContent = 'Unable to rebalance: available cash after planned sales is insufficient to complete the recommended purchases.';
                        return;
                    }

                    for (const order of sellOrders) {
                        const { stock, quantity } = order;
                        const orderValue = roundMoney(stock.price * quantity);
                        const fees = calculateFees(orderValue);
                        cashBalance = roundMoney(cashBalance + orderValue - fees);
                        const remainingQuantity = (holdings.get(stock.code) || 0) - quantity;
                        if (remainingQuantity === 0) {
                            holdings.delete(stock.code);
                        } else {
                            holdings.set(stock.code, remainingQuantity);
                        }
                    }

                    for (const order of buyOrders) {
                        const { stock, quantity } = order;
                        const orderValue = roundMoney(stock.price * quantity);
                        const fees = calculateFees(orderValue);
                        const totalCost = roundMoney(orderValue + fees);
                        cashBalance = roundMoney(cashBalance - totalCost);
                        holdings.set(stock.code, (holdings.get(stock.code) || 0) + quantity);
                    }

                    if (sellOrders.length + buyOrders.length === 0) {
                        message.textContent = 'Your portfolio already matches the robo-advisor recommendation. No trades were needed.';
                    } else {
                        message.textContent = '';
                        successMessage.textContent = 'Robo-advisor portfolio updated successfully.';
                        successMessage.hidden = false;
                        successMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                    updateAccountSummary();
                });

                updateAccountSummary();
                }
            },
            on_finish: function() {
                if (portfolioPageObserver) {
                    portfolioPageObserver.disconnect();
                    portfolioPageObserver = null;
                }
            }
        };

        timeline.push(introInstructions, roboInstructions, rulesInstructions, portfolioInstructions);
        timeline.push(createPortfolioInstructions);

        jsPsych.run(timeline);
    </script>
